# ibl-twin — TLS termination + reverse proxy. Replace HOSTNAME.
server {
  listen 80;
  listen [::]:80;
  server_name HOSTNAME;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name HOSTNAME;

  ssl_certificate     /etc/letsencrypt/live/HOSTNAME/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/HOSTNAME/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Twin accepts 100MB video uploads; the 1MB default breaks Create Twin silently.
  # The avatar catalogue is ~3.9 MB of JSON and shipped uncompressed
  # (encodedBodySize === decodedBodySize). Compressing it is the single
  # biggest win available on this route.
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain
             image/svg+xml application/manifest+json;

  client_max_body_size 120m;
  proxy_read_timeout 120s;

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
